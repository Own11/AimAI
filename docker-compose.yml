services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aimai}
      POSTGRES_USER: ${POSTGRES_USER:-aimai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_ENABLED: "1"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  redis:
    image: redis:7-alpine
  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_ENABLED: "1"
    command: celery -A config worker -l info
    depends_on:
      - db
      - redis
  beat:
    build: .
    env_file: .env
    environment:
      POSTGRES_ENABLED: "1"
    command: celery -A config beat -l info
    depends_on:
      - db
      - redis
volumes:
  postgres_data:
