{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — AimAI</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#080a0b;color:#f5f7f5}input{width:100%;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#171b1c;color:#fff;padding:14px 16px;font-size:16px;outline:none;transition:.2s}input:focus{border-color:#00e4a0;box-shadow:0 0 0 3px rgba(0,228,160,.12)}label{display:block;margin-bottom:8px;color:rgba(255,255,255,.72);font-size:14px;font-weight:600}ul.errorlist{margin:8px 0;color:#ff8d8d;font-size:13px;list-style:none;padding:0}form p{margin:0 0 18px}.helptext{display:none!important}</style></head><body class="min-h-screen"><main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-5 py-10"><section class="w-full max-w-[460px] rounded-3xl border border-white/10 bg-[#111718] p-7 shadow-2xl shadow-black/40 sm:p-10"><a href="/" class="mb-10 flex items-center gap-3 text-lg font-semibold"><img width="40" height="40" src="{% static 'images/aimai-logo.png' %}" class="h-10 w-10 object-contain" alt="AimAI"><span>AimAI</span></a><p class="mb-3 text-sm font-medium text-[#00e4a0]">Начни с одной задачи</p><h1 class="text-4xl font-semibold tracking-tight">Создать аккаунт</h1><p class="mt-3 text-sm leading-6 text-white/45">Планируй честно, замечай причины и меняй систему маленькими шагами.</p><form method="post" class="mt-8">{% csrf_token %}{{ form.as_p }}<button class="w-full rounded-xl bg-gradient-to-r from-[#10bdf5] to-[#00e4a0] py-3.5 text-base font-semibold text-[#061313] transition hover:-translate-y-0.5">Создать аккаунт <span class="ml-3">↗</span></button></form><p class="mt-7 text-center text-sm text-white/45">Уже есть аккаунт? <a class="font-medium text-[#00e4a0] hover:text-white" href="{% url 'account_login' %}">Войти</a></p></section></main></body></html>
